# The gateway: one public address (:8080), routing by path.
# Today everything goes to the monolith. When notification-service exists, add its
# location block ABOVE "location /" so /api/notifications is sent there instead.

upstream monolith {
    server monolith:3000;
}

server {
    listen 80;

    # Correlation id: keep the caller's X-Request-Id, or mint one, and pass it on.
    set $req_id $http_x_request_id;
    if ($req_id = "") {
        set $req_id $request_id;
    }

    location = /gateway-health {
        access_log off;
        return 200 "ok\n";
    }

    # location /api/notifications {
    #     proxy_pass http://notification-service:8000;
    # }

    location / {
        proxy_pass http://monolith;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $req_id;
        add_header X-Request-Id $req_id always;
    }
}
