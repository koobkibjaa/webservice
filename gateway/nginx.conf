# The gateway: one public address (:8080), routing by path. The extracted context's API keeps
# its old addresses; only where they are served from changed. Everything else is the monolith.
#
# Upstreams are looked up through Docker's DNS at request time (resolver + a variable in
# proxy_pass), not once at startup. Otherwise a restarted container comes back on a new IP and
# nginx keeps sending to the old one (502) until the gateway itself is restarted.

server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $monolith             http://monolith:3000;
    set $notification_service http://notification-service:8000;
    set $payment_service      http://payment-service:8000;

    # Correlation id: keep the caller's X-Request-Id, or mint one, and pass it on.
    set $req_id $http_x_request_id;
    if ($req_id = "") {
        set $req_id $request_id;
    }

    # Inherited by every location below (none of them sets its own proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $req_id;

    location = /gateway-health {
        access_log off;
        return 200 "ok\n";
    }

    # Notifications context -> notification-service. Exact match for the list, prefix for /{id}/read.
    location = /api/notifications {
        proxy_pass $notification_service;
    }
    location ^~ /api/notifications/ {
        proxy_pass $notification_service;
    }

    # Payments & Wallet context -> payment-service. Exact matches only: its /internal/* routes are
    # for the monolith inside the network and are deliberately not reachable from outside.
    location = /api/payments/webhook       { proxy_pass $payment_service; }
    location = /api/payments/simulate      { proxy_pass $payment_service; }
    location = /api/provider/wallet        { proxy_pass $payment_service; }
    location = /api/customer/transactions  { proxy_pass $payment_service; }

    location / {
        proxy_pass $monolith;
    }
}
