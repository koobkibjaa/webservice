# The one command that boots everything:  docker compose up -d --build --wait
# Reset to first boot:                    docker compose down -v --remove-orphans
#
# Only the gateway and the tool screens publish a port. The monolith and the new services are
# reached through nginx on http://localhost:8080, never directly.
#
# Passwords below are local-only dev defaults so a clean clone boots with one command. Override
# any of them in a git-ignored .env (see .env.example).
name: capstone

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      monolith:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/gateway-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # bangkok-homeservice as given; its ports: line is dropped so it only listens inside the network.
  monolith:
    build:
      context: ./bangkok-homeservice
      target: runtime
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev secret - do not use in production}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-edemand}:${RABBITMQ_PASSWORD:-edemand-dev}@rabbitmq:5672
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: homeservice
      KEYCLOAK_CLIENT_ID: homeservice-monolith
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-monolith-dev-secret}
      PAYMENT_SERVICE_URL: http://payment-service:8000
      # Keep the SQLite file between restarts (seed only when empty): the extracted services keep
      # their data, and a monolith that reseeded on every boot would reuse order ids they remember.
      RESEED_ON_BOOT: "false"
      # Area E: traces to Jaeger, Prometheus metrics on 9464 (in-network only).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: monolith
      METRICS_PORT: "9464"
    volumes:
      - monolith-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Area A: the Notifications context, extracted. Owns notification-db; fed by RabbitMQ.
  notification-service:
    build: ./notification-service
    environment:
      DATABASE_URL: postgresql://notifications:${NOTIFICATION_DB_PASSWORD:-notifications-dev}@notification-db:5432/notifications
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-edemand}:${RABBITMQ_PASSWORD:-edemand-dev}@rabbitmq:5672/
      # Area B: tokens are Keycloak's. iss is the public address; the keys are fetched in-network.
      KEYCLOAK_ISSUER: http://localhost:8180/realms/homeservice
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/homeservice/protocol/openid-connect/certs
      TOKEN_AUDIENCE: notification-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: notification-service
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Area A (second seam): the Payments & Wallet context, extracted. Owns payment-db; receives
  # booking events through RabbitMQ and emits payment.succeeded through its own outbox.
  payment-service:
    build: ./payment-service
    environment:
      DATABASE_URL: postgresql://payments:${PAYMENT_DB_PASSWORD:-payments-dev}@payment-db:5432/payments
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-edemand}:${RABBITMQ_PASSWORD:-edemand-dev}@rabbitmq:5672/
      KEYCLOAK_ISSUER: http://localhost:8180/realms/homeservice
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/homeservice/protocol/openid-connect/certs
      TOKEN_AUDIENCE: payment-service
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-edemand-webhook-secret}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: payment-service
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-payments-dev}
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notifications-dev}
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"   # management UI (a tool screen): http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-edemand}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-edemand-dev}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  # Area B: the identity provider. Imports keycloak/realm-homeservice.json on first boot.
  # --hostname pins the token issuer to the public address, so a token fetched from the host
  # (scripts, mobile) and one fetched in-network (the monolith) carry the same iss.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm", "--http-port=8080", "--hostname=http://localhost:8180",
              "--hostname-backchannel-dynamic=true", "--health-enabled=true"]
    ports:
      - "8180:8080"     # Keycloak admin console (a tool screen): http://localhost:8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-monolith-dev-secret}   # read by the realm file
      PACT_CUSTOMER_PASSWORD: ${PACT_CUSTOMER_PASSWORD:-pact-dev}               # read by the realm file
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 15

  # ---------- Area E: contract tests ----------
  # docker compose run --rm contract-tests   (the same command runs in .github/workflows/ci.yml)
  # The monolith's Pact consumer tests write pacts/, then both services are verified against them.
  contract-tests:
    profiles: ["test"]
    build:
      context: ./bangkok-homeservice
      target: test
    command: ["sh", "contracts/run.sh"]
    environment:
      NODE_ENV: test
      PACT_DIR: /pacts
      PACT_DO_NOT_TRACK: "true"   # offline: no usage statistics sent anywhere
      PAYMENT_SERVICE_URL: http://payment-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-monolith-dev-secret}
      PACT_CUSTOMER_PASSWORD: ${PACT_CUSTOMER_PASSWORD:-pact-dev}
      PAYMENT_DB_URL: postgresql://payments:${PAYMENT_DB_PASSWORD:-payments-dev}@payment-db:5432/payments
      NOTIFICATION_DB_URL: postgresql://notifications:${NOTIFICATION_DB_PASSWORD:-notifications-dev}@notification-db:5432/notifications
    volumes:
      - ./pacts:/pacts
    depends_on:
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # ---------- Area E: observability ----------
  # Traces: every service sends OTLP to Jaeger, which keeps them in memory.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"   # Jaeger UI (a tool screen): http://localhost:16686
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"

  # Metrics: scrapes http_request_duration_seconds from the monolith and both services.
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"     # Prometheus UI (a tool screen): http://localhost:9090
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Dashboard "Services: rate, errors, response time", provisioned from observability/grafana.
  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3000:3000"     # Grafana (a tool screen): http://localhost:3000, anonymous viewing on
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-dev}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/services.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  monolith-data:
  payment-db-data:
  notification-db-data:
  rabbitmq-data:
