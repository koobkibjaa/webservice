# The one command that boots everything:  docker compose up -d --build --wait
# Reset to first boot:                    docker compose down -v --remove-orphans
#
# Only the gateway publishes a port. The monolith (and later the new services) are reached
# through nginx on http://localhost:8080, never directly.
name: capstone

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      monolith:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/gateway-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # bangkok-homeservice as given; its ports: line is dropped so it only listens inside the network.
  monolith:
    build:
      context: ./bangkok-homeservice
      target: runtime
    environment:
      JWT_SECRET: "dev secret - do not use in production"
      WEBHOOK_SECRET: "edemand-webhook-secret"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
